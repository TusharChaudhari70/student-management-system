<div class="modal-overlay" (click)="closed.emit()">
  <section class="modal-box" role="dialog" aria-modal="true" [attr.aria-label]="title" (click)="$event.stopPropagation()">
    <header><h2>{{ title }}</h2><button type="button" aria-label="Close" (click)="closed.emit()">×</button></header>
    <div class="modal-content"><ng-content></ng-content></div>
  </section>
</div>
