<div class="container">

  <div class="row justify-content-center align-items-center min-vh-100">

    <div class="col-md-5 col-lg-4">

      <div class="card shadow p-4">

        <h3 class="text-center mb-2">
          Student Management System
        </h3>

        <p class="text-center text-muted mb-4">
          Login
        </p>

        <!-- Error message -->
        <div
          *ngIf="errorMessage"
          class="alert alert-danger"
        >
          {{ errorMessage }}
        </div>

        <form (ngSubmit)="login()">

          <!-- Username -->

          <div class="mb-3">

            <label class="form-label">
              Username
            </label>

            <input
              type="text"
              class="form-control"
              name="username"
              [(ngModel)]="username"
              placeholder="Enter username"
            >

          </div>


          <!-- Password -->

          <div class="mb-3">

            <label class="form-label">
              Password
            </label>

            <input
              type="password"
              class="form-control"
              name="password"
              [(ngModel)]="password"
              placeholder="Enter password"
            >

          </div>


          <!-- Login button -->

          <button
            type="submit"
            class="btn btn-primary w-100"
            [disabled]="loading"
          >

            <span *ngIf="!loading">
              Login
            </span>

            <span *ngIf="loading">
              Logging in...
            </span>

          </button>

        </form>

      </div>

    </div>

  </div>

</div>
