<div class="student-actions">

  <button class="operation-card add" (click)="showAddStudent()">
    <span class="operation-icon">＋</span>
    <span class="operation-title">Add Student</span>
    <span class="operation-text">Create a new student record</span>
  </button>

  <button class="operation-card view" (click)="viewStudents()">
    <span class="operation-icon">☷</span>
    <span class="operation-title">View Students</span>
    <span class="operation-text">View all student records</span>
  </button>

  <button class="operation-card update" (click)="showUpdateStudent()">
    <span class="operation-icon">✎</span>
    <span class="operation-title">Update Student</span>
    <span class="operation-text">Modify student information</span>
  </button>

  <button class="operation-card delete" (click)="showDeleteStudent()">
    <span class="operation-icon">⌫</span>
    <span class="operation-title">Delete Student</span>
    <span class="operation-text">Remove a student record</span>
  </button>

</div>
