<div class="container mt-5">
  <div class="card shadow p-4">

    <div class="d-flex justify-content-between align-items-center">
      <h2>Teacher Dashboard</h2>

      <button
        class="btn btn-danger"
        (click)="logout()">
        Logout
      </button>
    </div>

    <p class="text-muted mt-3">
      Welcome, {{ username }}
    </p>

    <hr>

    <h5>
      Role: {{ role }}
    </h5>

  </div>
</div>
