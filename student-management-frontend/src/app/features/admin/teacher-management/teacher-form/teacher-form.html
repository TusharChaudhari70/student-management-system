<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="form-grid">
    <div class="form-group">
      <label>Username <span>*</span></label
      ><input
        pInputText
        type="text"
        [name]="formName + 'Username'"
        formControlName="username"
        placeholder="Enter username"
      /><small
        class="error"
        *ngIf="form.controls.username.invalid && form.controls.username.touched"
        >Username must be at least 3 characters</small
      >
    </div>
    <div class="form-group">
      <label>Name <span>*</span></label
      ><input
        pInputText
        type="text"
        [name]="formName + 'Name'"
        formControlName="name"
        placeholder="Enter teacher name"
      /><small class="error" *ngIf="form.controls.name.invalid && form.controls.name.touched"
        >Name is required</small
      >
    </div>
    <div class="form-group">
      <label>Email <span>*</span></label
      ><input
        pInputText
        type="email"
        [name]="formName + 'Email'"
        formControlName="email"
        placeholder="Enter teacher email"
      /><small class="error" *ngIf="form.controls.email.invalid && form.controls.email.touched"
        >Enter a valid email</small
      >
    </div>
    @if (includePassword) {
      <div class="form-group">
        <label>Password <span>*</span></label
        ><input
          pInputText
          type="password"
          [name]="formName + 'Password'"
          formControlName="password"
          placeholder="Enter password"
        /><small
          class="error"
          *ngIf="form.controls.password.invalid && form.controls.password.touched"
          >Password must be at least 6 characters</small
        >
      </div>
    }
  </div>
  <div class="form-actions">
    <p-button
      type="submit"
      styleClass="add-btn"
      [disabled]="form.invalid"
      [label]="submitLabel"
    /><p-button
      type="button"
      severity="secondary"
      styleClass="cancel-btn"
      label="Cancel"
      (onClick)="cancelled.emit(form)"
    />
  </div>
</form>
