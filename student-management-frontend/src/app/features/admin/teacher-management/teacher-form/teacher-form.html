<form #form="ngForm" (ngSubmit)="submitted.emit(form)">
  <div class="form-grid">
    <div class="form-group"><label>Username <span>*</span></label><input type="text" [name]="formName + 'Username'" [(ngModel)]="teacher.username" required minlength="3" #username="ngModel" placeholder="Enter username"><small class="error" *ngIf="username.invalid && username.touched">Username must be at least 3 characters</small></div>
    <div class="form-group"><label>Name <span>*</span></label><input type="text" [name]="formName + 'Name'" [(ngModel)]="teacher.name" required #name="ngModel" placeholder="Enter teacher name"><small class="error" *ngIf="name.invalid && name.touched">Name is required</small></div>
    <div class="form-group"><label>Email <span>*</span></label><input type="email" [name]="formName + 'Email'" [(ngModel)]="teacher.email" required email #email="ngModel" placeholder="Enter teacher email"><small class="error" *ngIf="email.invalid && email.touched">Enter a valid email</small></div>
    @if (includePassword) { <div class="form-group"><label>Password <span>*</span></label><input type="password" [name]="formName + 'Password'" [(ngModel)]="teacher.password" required minlength="6" #password="ngModel" placeholder="Enter password"><small class="error" *ngIf="password.invalid && password.touched">Password must be at least 6 characters</small></div> }
  </div>
  <div class="form-actions"><button type="submit" class="add-btn" [disabled]="form.invalid">{{ submitLabel }}</button><button type="button" class="cancel-btn" (click)="cancelled.emit(form)">Cancel</button></div>
</form>
