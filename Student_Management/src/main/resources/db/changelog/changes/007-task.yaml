databaseChangeLog:

  - changeSet:
      id: 007-task-1
      author: Tushar
      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: student_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: teacher_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
              - column:
                  name: description
                  type: varchar(2000)
              - column:
                  name: type
                  type: varchar(50)
              - column:
                  name: created_at
                  type: datetime2
              - column:
                  name: due_date
                  type: datetime2
              - column:
                  name: is_read
                  type: bit
                  defaultValueBoolean: false
              - column:
                  name: is_submitted
                  type: bit
                  defaultValueBoolean: false

  - changeSet:
      id: 007-task-2
      author: Tushar
      changes:
        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: student_id
            referencedTableName: students
            referencedColumnNames: id
            constraintName: fk_tasks_student

  - changeSet:
      id: 007-task-3
      author: Tushar
      changes:
        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: teacher_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_tasks_teacher
