databaseChangeLog:

  - changeSet:
      id: 006-document-1
      author: Tushar
      changes:
        - createTable:
            tableName: documents
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: student_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: teacher_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
              - column:
                  name: description
                  type: varchar(2000)
              - column:
                  name: file_name
                  type: varchar(255)
              - column:
                  name: file_url
                  type: varchar(1000)
              - column:
                  name: uploaded_at
                  type: datetime2
              - column:
                  name: is_read
                  type: bit
                  defaultValueBoolean: false

  - changeSet:
      id: 006-document-2
      author: Tushar
      changes:
        - addForeignKeyConstraint:
            baseTableName: documents
            baseColumnNames: student_id
            referencedTableName: students
            referencedColumnNames: id
            constraintName: fk_documents_student

  - changeSet:
      id: 006-document-3
      author: Tushar
      changes:
        - addForeignKeyConstraint:
            baseTableName: documents
            baseColumnNames: teacher_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_documents_teacher
