databaseChangeLog:

  - changeSet:
      id: 004-message-update-1
      author: Tushar
      changes:

        - addColumn:
            tableName: messages
            columns:

              - column:
                  name: teacher_id
                  type: bigint

              - column:
                  name: file_name
                  type: varchar(255)

              - column:
                  name: file_url
                  type: varchar(1000)

  - changeSet:
      id: 004-message-update-2
      author: Tushar
      changes:

        - dropForeignKeyConstraint:
            baseTableName: messages
            constraintName: fk_messages_sender

        - dropForeignKeyConstraint:
            baseTableName: messages
            constraintName: fk_messages_receiver

  - changeSet:
      id: 004-message-update-3
      author: Tushar
      changes:

        - dropColumn:
            tableName: messages
            columnName: sender_id

        - dropColumn:
            tableName: messages
            columnName: receiver_id

  - changeSet:
      id: 004-message-update-4
      author: Tushar
      changes:

        - sql:
            sql: SELECT 1