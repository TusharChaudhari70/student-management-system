databaseChangeLog:

  - changeSet:
      id: 005-student-soft-delete-1
      author: Tushar
      changes:
        - addColumn:
            tableName: students
            columns:
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: students
            columnName: is_deleted
