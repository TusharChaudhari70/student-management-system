databaseChangeLog:

  - changeSet:
      id: 003-message-1
      author: Tushar
      changes:
        - createTable:
            tableName: messages
            columns:

              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: teacher_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: student_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: message
                  type: varchar(2000)

              - column:
                  name: file_name
                  type: varchar(255)

              - column:
                  name: file_url
                  type: varchar(1000)

              - column:
                  name: sent_at
                  type: datetime2

              - column:
                  name: is_read
                  type: bit
                  defaultValueBoolean: false

  - changeSet:
      id: 003-message-2
      author: Tushar
      changes:
        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: teacher_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_messages_teacher

  - changeSet:
      id: 003-message-3
      author: Tushar
      changes:
        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: student_id
            referencedTableName: students
            referencedColumnNames: id
            constraintName: fk_messages_student